<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Redirecting...</title>
<script>
  // SPA fallback: redirect to root. The service worker handles real SPA routing.
  // This only fires for browsers without service worker support.
  var repo = location.pathname.match(/^\/[^/]+\//);
  location.replace((repo ? repo[0] : '/') + '?' + Date.now());
</script>
</head>
<body>Redirecting...</body>
</html>
