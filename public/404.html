<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>InterviewIQ</title>
  <script>
    // GitHub Pages SPA redirect: capture the path and redirect to index.html
    // This allows clean URLs like /practice, /admin, /settings
    var path = window.location.pathname;
    var search = window.location.search;
    // Redirect to index.html with the path as a query parameter
    window.location.replace('/interviewiq/' + '?p=' + encodeURIComponent(path) + search);
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
