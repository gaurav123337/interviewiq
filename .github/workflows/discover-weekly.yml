name: Discover weekly (skill-gap seeds)

# Phase 4 Item D5 — skill-gap auto-discovery. Reads the skill catalog, finds
# skills with fewer than GAP_MIN approved discovery resources, and queues
# PENDING discovery_seeds (origin=skill-auto). Nothing crawls until a human
# approves in Admin → Discovery — the approval gate is the crawl trigger.
# Budget-capped so the queue stays reviewable; deterministic dedupe means
# rejected URLs are never re-proposed.
#  ┌─ minute  ┌─ hour  ┌─ day of month  ┌─ month  ┌─ day of week (0=Sunday)
#  │           │        │                │          │
on:
  schedule:
    - cron: "0 6 * * 1" # every Monday 06:00 UTC — before the crawl window
  workflow_dispatch:
    inputs:
      max-total:
        description: "Max seeds to queue this run (default 20)"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check secrets
        id: check-secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ SUPABASE_ACCESS_TOKEN not configured — skill-gap discovery will be skipped"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Queue skill-gap seeds (pending — human-approved)
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          # Optional: raises GitHub API rate limits for the search sanity-probe.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/discover-skills.js --max-total "${{ github.event.inputs.max-total || '20' }}"
