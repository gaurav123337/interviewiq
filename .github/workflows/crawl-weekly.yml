name: Discovery crawl (manual dispatch)

# Phase 4 Item D2 — runs scripts/crawl-sources.js against APPROVED
# discovery_seeds only (the approval gate is the crawl trigger: nothing
# crawls unless a human approved the seed in Admin → Discovery).
# Budget-capped by the script (25 pages/seed, 100 total, robots-checked).
#
# Dispatch-only by design: crawl cadence stays a human decision (the same
# gate philosophy as discovery itself). To auto-crawl weekly, add:
#   schedule:
#     - cron: "0 7 * * 1"   # Mondays 07:00 UTC, after discover-weekly (06:00)

on:
  workflow_dispatch:
    inputs:
      max-total:
        description: "Max pages across all seeds this run (default 100)"
        required: false
        default: "100"

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check secrets
        id: check-secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ SUPABASE_ACCESS_TOKEN not configured — discovery crawl will be skipped"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Crawl approved seeds → drafts + resources
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/crawl-sources.js --max-total "${{ github.event.inputs.max-total || '100' }}"
