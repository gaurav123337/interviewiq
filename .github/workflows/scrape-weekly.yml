name: Scrape question sources

# Runs daily; the scraper script itself checks the admin-configured schedule
# (Supabase scraper_config → days) and skips days that aren't selected — so
# cadence is configurable from the Admin dashboard without editing this file.
#  ┌─ minute  ┌─ hour  ┌─ day of month  ┌─ month  ┌─ day of week (0=Sunday)
#  │           │        │                │          │
on:
  schedule:
    - cron: "0 3 * * *" # every day 03:00 UTC — script enforces the schedule
  workflow_dispatch:
    inputs:
      clean-max:
        description: "Drafts to AI-clean this run (default 40)"
        required: false
        default: "40"

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scrape sources → Supabase (drafts)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/scrape-sources.js
      - name: AI-clean drafts (optional — skips without a configured key)
        # Provider config comes from Supabase (Admin → Secrets → AI pipeline);
        # the legacy AI_CLEAN_* secrets are only a fallback.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          AI_CLEAN_KEY: ${{ secrets.AI_CLEAN_KEY }}
          AI_CLEAN_BASE: ${{ secrets.AI_CLEAN_BASE }}
          AI_CLEAN_MODEL: ${{ secrets.AI_CLEAN_MODEL }}
          AI_CLEAN_MAX: ${{ github.event.inputs.clean-max || '40' }}
        run: node scripts/ai-clean.js
