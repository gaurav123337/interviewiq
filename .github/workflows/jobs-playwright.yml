name: Scrape jobs (Playwright)

# Phase 4 Item C — JS-heavy PUBLIC job boards the ATS-API pipeline (jobs-fetch)
# can't see (client-rendered listings, SPA pagination). Targets are data in
# content/job-playwright-targets.json; anti-bot/ToS-protected sites are excluded
# by policy. Skips when SUPABASE_ACCESS_TOKEN is not configured (same guard as
# scrape-weekly.yml). Reports into jobs_fetch_reports → Admin → Cron job log.
#  ┌─ minute  ┌─ hour  ┌─ day of month  ┌─ month  ┌─ day of week (0=Sunday)
#  │           │        │                │          │
on:
  schedule:
    - cron: "0 5 * * *" # daily 05:00 UTC — after the 03:00 question scrape
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Check secrets
        id: check-secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ SUPABASE_ACCESS_TOKEN not configured — Playwright job scrape will be skipped"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Install Playwright + Chromium
        if: steps.check-secrets.outputs.configured == 'true'
        run: |
          npm i --no-save playwright@latest
          npx playwright install --with-deps chromium
      - name: Scrape job boards → Supabase (source "playwright")
        if: steps.check-secrets.outputs.configured == 'true'
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          AI_CLEAN_KEY: ${{ secrets.AI_CLEAN_KEY }}
          AI_CLEAN_BASE: ${{ secrets.AI_CLEAN_BASE }}
          AI_CLEAN_MODEL: ${{ secrets.AI_CLEAN_MODEL }}
        run: node scripts/scrape-jobs-playwright.mjs
