name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_supabase:
        description: 'Also deploy Supabase edge functions (frontend releases leave the backend unchanged)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # actions pinned to commit SHAs (docs/app-security.md G7) — upgrade
      # deliberately: bump the tag, then re-pin its SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # supply-chain gate (docs/app-security.md §9): no high/critical vulns in
      # production deps, or the deploy stops
      - run: npm audit --omit=dev --audit-level=high
      # fast retrieval-regression gate: a golden-set failure here stops the deploy
      - run: npm run eval:rag
      # type-check the WHOLE project including the test suite. `npm run build`
      # uses tsconfig.build.json, which EXCLUDES tests, so type regressions in
      # the tests would otherwise slip past the build and only surface at runtime.
      - run: npm run typecheck
      # build BEFORE test so the offline-readiness suite (service-worker precache
      # vs built assets) runs against the real dist/ artifact
      - run: npm run build
      # the unit/integration suite is a HARD gate — a failure stops the deploy.
      # (This was previously `npm test || echo …`, i.e. non-blocking, so real
      # regressions could ship green-looking; the suite is green now and CI keeps
      # it that way.)
      - run: npm test
      # edge-function shared code is pure TS — verify it with Deno so the
      # import-job extraction logic is tested in the pipeline (mirrors the
      # client suite, which exercises the same file)
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/_shared/
      # surface the offline-shell suite on the run summary so a regression is
      # visible at a glance, not just in the test logs (also re-gates on it)
      - name: Report offline-shell check
        run: node scripts/report-offline.mjs

      # ── Deploy to GitHub Pages via gh-pages branch ──────────────────────
      # Upload the built dist/ to a gh-pages branch so GitHub Pages can
      # serve the production bundle (not the source index.html).
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # Preserve files that aren't in dist/ (CNAME, etc.)
          keep_files: false

      # ── Deploy the same dist/ to Wasmer Edge ───────────────────────────
      # GitHub remains the source of truth: both sites receive the SAME build.
      # A Wasmer failure must fail this release, even if Pages already published,
      # so a green run cannot hide drift between the two public sites.
      # wasmer.toml packages dist/ behind Static Web Server; app.yaml pins
      # gaurav123337/jobassist and its job-assist.wasmer.app public alias.
      - name: Deploy to Wasmer Edge
        timeout-minutes: 10
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: |
          if [ -z "$WASMER_TOKEN" ]; then
            echo "::error title=Wasmer Edge::WASMER_TOKEN is not set - cannot synchronize both frontend sites"
            exit 1
          fi
          # Pinned Edge CLI, unpacked from the tagged release asset, instead of
          # `curl https://get.wasmer.io | sh`: that installer re-resolves
          # $RELEASES_URL/latest every run, so CI drove a production deploy with
          # whatever CLI happened to be newest that morning, and it piped a
          # remote script into sh with the deploy token sitting in the env.
          # WASMER_VERSION is the reviewed Edge CLI release — bump it deliberately.
          #
          # The digest pins the artifact, not its provenance: Wasmer publishes no
          # checksum file for v7.5.0, so this is the SHA-256 of the asset as
          # fetched on the pin date. If GitHub ever regenerates the asset, the
          # digest check fails the deploy instead of silently swapping the binary.
          WASMER_VERSION=v7.5.0
          WASMER_SHA256=23f99818deaad93859f8bb8292af81f0c39f25aea19eaccfb72fc7c9e8a3fae9
          curl -sSfL -o "$RUNNER_TEMP/wasmer.tar.gz" \
            "https://github.com/wasmerio/wasmer/releases/download/${WASMER_VERSION}/wasmer-linux-amd64.tar.gz"
          echo "${WASMER_SHA256}  $RUNNER_TEMP/wasmer.tar.gz" | sha256sum -c -
          # the installer unpacks the whole archive and puts bin/ on PATH; keep
          # the same layout so the CLI still finds its sibling lib/ if it needs it
          mkdir -p "$RUNNER_TEMP/wasmer"
          tar -xzf "$RUNNER_TEMP/wasmer.tar.gz" -C "$RUNNER_TEMP/wasmer"
          export PATH="$RUNNER_TEMP/wasmer/bin:$PATH"
          # fails the step loudly if the unpacked binary cannot run, before
          # anything reaches the deploy command below
          wasmer --version
          # --bump publishes a new package version. The CLI confirms the publish
          # on stdin, and CI has no TTY, so answer yes. The command then waits
          # for the new version to become reachable, which is the check that the
          # deploy actually took effect.
          # pipefail is turned off for this command only: once the CLI exits,
          # `yes` dies of SIGPIPE, and under pipefail that would fail an
          # otherwise successful deploy.
          # `set -e` is on in the runner shell, so a failing command substitution
          # would abort before STATUS is read; disable it around the capture.
          set +o pipefail
          set +e
          # Keep the name aligned with app.yaml's pinned jobassist app ID;
          # overriding it with interviewiq deploys the separate, wrong app.
          OUTPUT=$(yes | wasmer deploy --owner gaurav123337 --app-name jobassist --bump 2>&1)
          STATUS=$?
          set -e
          set -o pipefail
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            echo "::error title=Wasmer Edge::jobassist deployment failed - the frontend sites are not confirmed synchronized"
            exit "$STATUS"
          fi

      # Verify the public responses, not just the platform's deploy status. Pages
      # publishes asynchronously after the gh-pages push; allow propagation, then
      # compare the shell, service worker, and its referenced bundles byte-for-byte.
      - name: Verify synchronized frontend sites
        timeout-minutes: 10
        run: |
          python -I - "$GITHUB_WORKSPACE/dist" \
            https://gaurav123337.github.io/interviewiq/ \
            https://job-assist.wasmer.app/ <<'PY'
          import hashlib
          import os
          import re
          import sys
          import time
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from urllib.request import Request, urlopen

          dist = Path(sys.argv[1])
          html = (dist / "index.html").read_bytes()
          assets = sorted(set(re.findall(r'(?:src|href)="\./(assets/[A-Za-z0-9_.-]+)"', html.decode("utf-8"))))
          if not assets:
              raise SystemExit("No built assets found in index.html")
          files = ["index.html", "sw.js", *assets]
          expected = {name: hashlib.sha256((dist / name).read_bytes()).hexdigest() for name in files}
          revision = os.environ["GITHUB_SHA"]

          def verify(base, name):
              request = Request(base + name + "?release=" + revision, headers={"Cache-Control": "no-cache"})
              with urlopen(request, timeout=15) as response:
                  actual = hashlib.sha256(response.read()).hexdigest()
              if actual != expected[name]:
                  raise RuntimeError(f"{base}{name} does not match this release")

          for base in sys.argv[2:]:
              for attempt in range(8):
                  try:
                      verify(base, "index.html")
                      break
                  except Exception as error:
                      if attempt == 7:
                          raise
                      print(f"Waiting for {base}: {error}", flush=True)
                      time.sleep(15)
              with ThreadPoolExecutor(max_workers=6) as pool:
                  list(pool.map(lambda name: verify(base, name), files))
              message = f"Verified {base}: {len(files)} files match commit {revision} (SHA-256)"
              print(message, flush=True)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(message + "\n\n")
          PY

      # ── Deploy Supabase edge functions (explicit manual opt-in only) ───
      # A frontend push must not change backend functions. Request them through
      # workflow_dispatch with deploy_supabase=true; credentials stay in secrets.
      - name: Deploy edge functions (Supabase)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_supabase }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice title=Supabase edge functions::SUPABASE_ACCESS_TOKEN is not set - skipping the function deploy"
            exit 0
          fi
          # An unusable token (wrong secret, revoked, or a service-role key pasted
          # by mistake) can never deploy functions — the CLI answers "Invalid
          # access token format. Must be like `sbp_0102...1920`". Warn, don't fail:
          # a client-only change must not go red over a credential the build
          # cannot fix, and the annotation keeps the stale token visible.
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) ;;
            *)
              echo "::warning title=Supabase edge functions::SUPABASE_ACCESS_TOKEN is not an sbp_ personal access token - skipping the function deploy; rotate the secret to ship functions"
              exit 0
              ;;
          esac
          # The CLI is a pinned devDependency (supabase 2.122.0 in
          # package.json), so this runs the exact version recorded in
          # package-lock.json rather than whatever `npx` would have fetched that
          # day. It survives `npm ci --ignore-scripts`: the platform binary
          # ships as an optionalDependency tarball, not an install script.
          # Resolving through PATH — not `npx` — means a missing dependency
          # fails loudly here instead of silently pulling a newer CLI in the
          # middle of a deploy.
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          supabase --version
          supabase functions deploy import-job \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          supabase functions deploy jobs-fetch \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          supabase functions deploy send-recommendations-digest \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          supabase functions deploy send-apply-digest \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          supabase functions deploy send-rag-digest \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          supabase functions deploy submit-resource \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          supabase functions deploy revalidate-resources \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          supabase functions deploy trends-refresh \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          supabase functions deploy send-security-digest \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          supabase functions deploy mfa-recovery \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          supabase functions deploy recovery-backup \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          supabase functions deploy secret-status \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          supabase functions deploy test-email \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          supabase functions deploy pay-tip \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          # embed — server-side embeddings proxy for keyless RAG queries.
          # --no-verify-jwt so the gateway forwards the request and the function
          # verifies the caller itself (callerFrom → real getUser).
          supabase functions deploy embed \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          # article-fetch — SSRF-guarded fetch of a user-pasted article URL.
          # --no-verify-jwt so the gateway forwards the request and the function
          # verifies the signed-in caller itself (requireUser → real getUser).
          supabase functions deploy article-fetch \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          # content-index — admin bulk-indexer for KB content items. Was missing
          # from this list (deployed by hand), so it could drift silently; register
          # it here so it ships every deploy. requireAdmin-gated; --no-verify-jwt so
          # the function verifies the caller itself.
          supabase functions deploy content-index \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          # seed-rag — admin one-click seed of the RAG starter corpus using the
          # shared, server-configured embeddings provider (no service-role key in a
          # shell). requireAdmin-gated; --no-verify-jwt so the function verifies the
          # caller itself.
          supabase functions deploy seed-rag \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          # ai-chat — the cloud AI proxy (chat + GET /models + the admin-gated
          # probe-models / set-provider-model actions for the model picker).
          # Was deployed by hand only, so it could drift silently; register it here
          # so it ships every deploy. --no-verify-jwt: the function authenticates
          # callers itself (Bearer != anon) and requireAdmin-gates the config
          # actions.
          supabase functions deploy ai-chat \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
