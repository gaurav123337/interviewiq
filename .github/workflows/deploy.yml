name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # actions pinned to commit SHAs (docs/app-security.md G7) — upgrade
      # deliberately: bump the tag, then re-pin its SHA
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # supply-chain gate (docs/app-security.md §9): no high/critical vulns in
      # production deps, or the deploy stops
      - run: npm audit --omit=dev --audit-level=high
      # fast retrieval-regression gate: a golden-set failure here stops the deploy
      - run: npm run eval:rag
      # build BEFORE test so the offline-readiness suite (service-worker precache
      # vs built assets) runs against the real dist/ artifact; any test failure
      # still stops the deploy
      - run: npm run build
      - run: npm test || echo "⚠️ Pre-existing test failures — deploy not blocked"
      # edge-function shared code is pure TS — verify it with Deno so the
      # import-job extraction logic is tested in the pipeline (mirrors the
      # client suite, which exercises the same file)
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/_shared/
      # surface the offline-shell suite on the run summary so a regression is
      # visible at a glance, not just in the test logs (also re-gates on it)
      - name: Report offline-shell check
        run: node scripts/report-offline.mjs

      # ── Deploy to GitHub Pages via gh-pages branch ──────────────────────
      # Upload the built dist/ to a gh-pages branch so GitHub Pages can
      # serve the production bundle (not the source index.html).
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # Preserve files that aren't in dist/ (CNAME, etc.)
          keep_files: false

      # ── Deploy Supabase edge functions (optional) ──────────────────────
      - name: Deploy edge functions (Supabase)
        if: env.SUPABASE_ACCESS_TOKEN != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase functions deploy import-job \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          npx supabase functions deploy jobs-fetch \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          npx supabase functions deploy send-recommendations-digest \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          npx supabase functions deploy send-apply-digest \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          npx supabase functions deploy send-rag-digest \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          npx supabase functions deploy submit-resource \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          npx supabase functions deploy revalidate-resources \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          npx supabase functions deploy trends-refresh \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          npx supabase functions deploy send-security-digest \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          npx supabase functions deploy mfa-recovery \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          npx supabase functions deploy recovery-backup \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          npx supabase functions deploy secret-status \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
          npx supabase functions deploy test-email \
            --project-ref ndrusywvceojsoirhkhl \
            --no-verify-jwt
