name: Revalidate resources (L5 guard)

# Resource-safety-guard §3 L5 / §5.2 — periodic re-validation of APPROVED
# discovered_resources. Anything unreachable, redirected, or probe-errored is
# auto-quarantined (back to pending, instantly hidden from the public
# credits/community view) and re-queued for admin review with probe evidence.
# Fail-closed by design: an approved link that stops working must not stay
# public. Reports into scraper_runs like every other pipeline.
#  ┌─ minute  ┌─ hour  ┌─ day of month  ┌─ month  ┌─ day of week (0=Sunday)
#  │           │        │                │          │
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC — after discover-weekly (06:00)
  workflow_dispatch:
    inputs:
      limit:
        description: "Max resources to re-check this run (default 200)"
        required: false
        default: "200"

permissions:
  contents: read

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check secrets
        id: check-secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "⚠️ SUPABASE_ACCESS_TOKEN not configured — L5 re-validation will be skipped"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Re-validate approved resources (quarantine failures)
        if: steps.check-secrets.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/revalidate-resources.js --limit "${{ github.event.inputs.limit || '200' }}"
